name: Scheduled jobs
# Notification delivery every 5 minutes (GitHub's shortest schedule; Vercel Hobby crons are daily only). The daily maintenance
# job runs from vercel.json. Needs repository secret CRON_SECRET (same value as in Vercel) and variable APP_URL.
on:
  schedule: [{ cron: "*/5 * * * *" }]
  workflow_dispatch:
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "CRON_SECRET not set; skipping"; exit 0; }
          curl -fsS --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "${{ vars.APP_URL || 'https://jonokotha.vercel.app' }}/api/internal/notifications/deliver"
